name: AgentIQ CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Unit, integration, and offline evals
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --locked --all-extras --dev

      - name: Run unit and integration tests
        run: uv run pytest -m "not live_eval" -v

  live-evals:
    name: Live LLM evals
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --locked --all-extras --dev

      - name: Run live evals with LLM grader
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: uv run pytest -m live_eval -v

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentiq-eval-results
          path: |
            output/eval-results.json
            output/eval-summary.md
          if-no-files-found: ignore
